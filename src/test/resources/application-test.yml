# =============================================================================
# TEST profile — in-memory H2 in PostgreSQL-compatibility mode.
# Activated by tests via @ActiveProfiles("test") so the suite runs with no
# Docker/PostgreSQL. Dev/prod always use the real PostgreSQL (see other profiles).
# =============================================================================
spring:
  datasource:
    url: jdbc:h2:mem:chatapp;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password: ""
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      # Run the actual Flyway migration and validate entity/schema compatibility.
      ddl-auto: validate
    show-sql: false

  flyway:
    enabled: true

  data:
    redis:
      # Tests use local presence and events without a Redis process.
      repositories:
        enabled: false

logging:
  level:
    root: WARN
    com.cloudzone.chatapp: INFO